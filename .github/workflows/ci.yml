name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q

  mypy:
    # Locks in the mypy-strict-clean state of src/oubliette_trap/. Regression on
    # any future PR (missing annotation, Any-leak) fails CI the same way a
    # ruff violation does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install mypy + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e ".[dev]"
      - name: mypy --strict on src/oubliette_trap/
        run: python -m mypy --strict --follow-imports=silent src/oubliette_trap/

  build:
    # Same allowlist gate the publish workflow runs before uploading.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Packaging boundary check
        env:
          TRAP_REQUIRE_DIST: "1"
        run: |
          pip install pytest "setuptools>=77.0"
          python -m pytest -q --noconftest tests/test_packaging_boundary.py
